<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pricing Plans</title>
  <link rel="stylesheet" href="task5.css" />
</head>
<body>
  <main class="pricing">
    <article class="plan">
      <h3>Basic</h3>
      <p class="price">₹0 / mo</p>
      <ul>
        <li>Feature A</li>
        <li>Feature B</li>
      </ul>
      <a class="btn" href="#">Choose</a>
    </article>

    <article class="plan popular">
      <h3>Standard</h3>
      <p class="price">₹499 / mo</p>
      <ul>
        <li>Feature A</li>
        <li>Feature B</li>
        <li>Feature C</li>
      </ul>
      <a class="btn" href="#">Choose</a>
    </article>

    <article class="plan">
      <h3>Premium</h3>
      <p class="price">₹999 / mo</p>
      <ul>
        <li>All features</li>
        <li>Priority support</li>
      </ul>
      <a class="btn" href="#">Choose</a>
    </article>
  </main>
</body>
</html>
