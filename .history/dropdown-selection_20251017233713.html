<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Selection</title>
</head>
<body>

  <h1>Select Your Preferences</h1>

  <label for="country">Country:</label>
  <select id="country">
    <option selected>India</option>
    <option>USA</option>
    <option>UK</option>
  </select><br><br>

  <label for="state">State:</label>
  <select id="state">
    <option selected>Uttar Pradesh</option>
    <option>Maharashtra</option>
    <option>Karnataka</option>
  </select><br><br>

  <label for="city">City:</label>
  <select id="city">
    <option selected>Varanasi</option>
    <option>Delhi</option>
    <option>Mumbai</option>
  </select><br><br>

  <label for="tourist">Favorite Tourist Place:</label>
  <select id="tourist">
    <option selected>Golden Temple</option>
    <option>Khajuraho Temples</option>
    <option>Varanasi Ghats</option>
  </select>

  <p>You have selected India, Uttar Pradesh, Varanasi, and Golden Temple as your favorite tourist place.</p>

</body>
</html>
